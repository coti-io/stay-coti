# ================================
# COTI Community Platform
# Docker Compose for Development (Services Only)
# Use this for local development with hot reload
# Run: docker-compose -f docker-compose.dev.yml up -d
# Then: yarn dev (to run frontend and backend with hot reload)
# ================================

services:
  # ================================
  # MySQL Database
  # ================================
  mysql:
    image: mysql:8.0
    container_name: coti-mysql-dev
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=coti_password
      - MYSQL_DATABASE=coti_community
      - MYSQL_USER=coti_user
      - MYSQL_PASSWORD=coti_password
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcoti_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

  # ================================
  # Redis Cache
  # ================================
  redis:
    image: redis:7-alpine
    container_name: coti-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: redis-server --appendonly yes

# ================================
# Volumes
# ================================
volumes:
  mysql_dev_data:
    driver: local
  redis_dev_data:
    driver: local
